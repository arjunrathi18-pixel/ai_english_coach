name: Build Android APK

# Runs automatically on every push to main, and can also be triggered
# manually from the GitHub Actions tab ("Run workflow" button).
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      # This repo only contains lib/ + pubspec.yaml — the platform
      # scaffolding (android/, ios/, etc.) that `flutter create` normally
      # generates is NOT committed. Always regenerate android/ fresh on
      # every build so a stale/partial folder can never cause a "deleted
      # v1 embedding" error. This only touches the android/ folder — your
      # lib/ and pubspec.yaml are never modified.
      - name: Generate fresh Android platform scaffolding
        run: |
          rm -rf android
          flutter create --platforms=android --org com.aienglishcoach --project-name ai_english_coach .

      # Some plugins (e.g. speech_to_text) ship an android/build.gradle
      # that looks up rootProject.ext.compileSdkVersion synchronously
      # while it configures itself — this happens BEFORE any afterEvaluate
      # hook could run, so the fix must define this as a plain top-level
      # ext property on the root project, not inside subprojects/
      # afterEvaluate (a very common Flutter-plugin compatibility issue,
      # not something wrong in our own code).
      - name: Patch root build.gradle for plugin compileSdk compatibility
        run: |
          python3 - << 'PYEOF'
          path = "android/build.gradle"
          with open(path) as f:
              content = f.read()

          patch = """
          ext {
              compileSdkVersion = 34
              targetSdkVersion = 34
              minSdkVersion = 24
          }
          """

          marker = "allprojects {"
          idx = content.find(marker)
          if idx != -1:
              # Insert right before the allprojects block so it's defined
              # as early as possible in root project evaluation.
              content = content[:idx] + patch.strip() + "\n\n" + content[idx:]
          else:
              content = patch.strip() + "\n\n" + content

          with open(path, "w") as f:
              f.write(content)

          print(content)
          PYEOF

      # The freshly generated manifest doesn't request microphone access,
      # which speech_to_text needs. Insert the permissions this app
      # requires right after the opening <manifest> tag.
      - name: Add required permissions to the generated manifest
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          sed -i '/<manifest /a \
              <uses-permission android:name="android.permission.RECORD_AUDIO" />\
              <uses-permission android:name="android.permission.INTERNET" />\
              <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />' "$MANIFEST"
          cat "$MANIFEST"

      # flutter_tts's *warning* suggests compiling against SDK 36, but
      # that's optional guidance, not a hard requirement — and this CI
      # runner's cached build-tools are too old to parse the newer SDK 36
      # platform jar (a real toolchain incompatibility, not our code).
      # Keep compileSdk/targetSdk at the well-supported 34 and only force
      # minSdk up to 24, which flutter_tts's manifest genuinely requires.
      - name: Raise app-level minSdk for plugin requirements
        run: |
          APP_GRADLE=android/app/build.gradle
          sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 34/' "$APP_GRADLE"
          sed -i 's/targetSdk = flutter.targetSdkVersion/targetSdk = 34/' "$APP_GRADLE"
          sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 24/' "$APP_GRADLE"
          cat "$APP_GRADLE"

      # flutter_tts and shared_preferences_android fail to compile their
      # Kotlin sources against the old Kotlin/AGP/Gradle combination
      # bundled in Flutter's default project template. flutter_tts 4.2.5
      # specifically requires a modern Kotlin compiler (2.x). AGP just
      # needs to be new enough for Kotlin's own compatibility gate
      # (>=7.3.1). Using sed here previously failed silently because it
      # didn't match the generated file's exact quoting/spacing — this
      # uses a regex that's tolerant of both, and prints the result so a
      # silent non-match is visible in the log instead of hiding.
      - name: Raise Gradle/AGP/Kotlin versions to a compatible set
        run: |
          python3 - << 'PYEOF'
          import re

          settings_path = "android/settings.gradle"
          with open(settings_path) as f:
              content = f.read()

          before = content
          content = re.sub(
              r'(id\s+[\'"]com\.android\.application[\'"]\s+version\s+[\'"])[^\'"]+([\'"])',
              r'\g<1>8.3.0\g<2>',
              content,
          )
          content = re.sub(
              r'(id\s+[\'"]org\.jetbrains\.kotlin\.android[\'"]\s+version\s+[\'"])[^\'"]+([\'"])',
              r'\g<1>2.1.0\g<2>',
              content,
          )
          if content == before:
              print("WARNING: no changes made to settings.gradle — pattern did not match!")
          with open(settings_path, "w") as f:
              f.write(content)
          print("=== settings.gradle after patch ===")
          print(content)

          wrapper_path = "android/gradle/wrapper/gradle-wrapper.properties"
          with open(wrapper_path) as f:
              wcontent = f.read()
          wcontent = re.sub(
              r'distributionUrl=.*',
              r'distributionUrl=https\\://services.gradle.org/distributions/gradle-8.4-all.zip',
              wcontent,
          )
          with open(wrapper_path, "w") as f:
              f.write(wcontent)
          print("=== gradle-wrapper.properties after patch ===")
          print(wcontent)
          PYEOF

      - name: Install dependencies
        run: flutter pub get

      # IMPORTANT: this passes your Anthropic API key from a GitHub Actions
      # secret into the build, so it is never committed to the repo.
      # Set it under: Repo -> Settings -> Secrets and variables -> Actions
      # -> New repository secret -> name it ANTHROPIC_API_KEY.
      - name: Build debug APK
        run: flutter build apk --debug --dart-define=ANTHROPIC_API_KEY=${{ secrets.ANTHROPIC_API_KEY }}

      # Debug APKs are large, unoptimized, and meant only for quick
      # testing. This also builds a release APK — smaller and faster.
      # It's signed with Flutter's default debug key (Flutter's template
      # already points the release build type at signingConfigs.debug),
      # which is fine for installing on your own device but NOT for
      # publishing to the Play Store — that needs your own signing key.
      - name: Build release APK
        run: flutter build apk --release --dart-define=ANTHROPIC_API_KEY=${{ secrets.ANTHROPIC_API_KEY }}

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk

      - name: Upload release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
