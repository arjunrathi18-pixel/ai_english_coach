name: Build Android APK

# Runs automatically on every push to main, and can also be triggered
# manually from the GitHub Actions tab ("Run workflow" button).
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      # This repo only contains lib/ + pubspec.yaml — the platform
      # scaffolding (android/, ios/, etc.) that `flutter create` normally
      # generates is NOT committed. If it's missing, generate it now.
      # Run on an existing project directory, `flutter create .` only ADDS
      # the missing platform folders — it does not touch or overwrite your
      # existing lib/ or pubspec.yaml.
      - name: Generate missing platform scaffolding if needed
        run: |
          if [ ! -d "android" ]; then
            echo "No android/ folder found — generating platform scaffolding..."
            flutter create --platforms=android --org com.aienglishcoach --project-name ai_english_coach .
          else
            echo "android/ folder already present — skipping scaffold generation."
          fi

      - name: Install dependencies
        run: flutter pub get

      # IMPORTANT: this passes your Anthropic API key from a GitHub Actions
      # secret into the build, so it is never committed to the repo.
      # Set it under: Repo -> Settings -> Secrets and variables -> Actions
      # -> New repository secret -> name it ANTHROPIC_API_KEY.
      - name: Build debug APK
        run: flutter build apk --debug --dart-define=ANTHROPIC_API_KEY=${{ secrets.ANTHROPIC_API_KEY }}

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
